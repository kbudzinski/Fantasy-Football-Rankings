name: Update rankings and deploy website

on:
  workflow_dispatch:
  schedule:
    - cron: "17 12 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install updater dependencies
        run: pip install -r requirements.txt

      - name: Update rankings, projections, stats, and news
        run: python update_data.py

      - name: Save refreshed rankings to repository
        run: |
          git config user.name "fantasy-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add players.js
          git diff --cached --quiet || git commit -m "Daily fantasy data update"
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
