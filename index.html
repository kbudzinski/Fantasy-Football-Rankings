<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fantasy Draft Board</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Fantasy Draft Board</h1>
      <p>2026 ESPN PPR · 12 teams · drag rows to rank instantly</p>
    </div>
    <div class="top-actions">
      <button id="addPlayerBtn" class="secondary">Add player</button>
      <button id="importBtn" class="secondary">Import</button>
      <button id="exportBtn" class="secondary">Export</button>
      <button id="resetBtn" class="danger ghost">Reset</button>
      <input id="importFile" type="file" accept=".json,.csv" hidden>
    </div>
  </header>

  <main>
    <section class="summary" id="summary"></section>

    <nav class="tabs" id="tabs" aria-label="Draft views"></nav>

    <section class="toolbar">
      <label class="search">
        <span>Search</span>
        <input id="searchInput" type="search" placeholder="Player, team, position…">
      </label>
      <label>
        <span>Position</span>
        <select id="positionFilter">
          <option value="">All positions</option>
          <option>QB</option><option>RB</option><option>WR</option>
          <option>TE</option><option>K</option><option>DST</option>
        </select>
      </label>
      <label>
        <span>Sort by</span>
        <select id="sortSelect">
          <option value="rank">My rank</option>
          <option value="name">Player name</option>
          <option value="pos">Position</option>
          <option value="team">NFL team</option>
          <option value="bye">Bye week</option>
          <option value="tier">Tier</option>
          <option value="market">Market</option>
          <option value="espn">ESPN</option>
          <option value="yahoo">Yahoo</option>
          <option value="sleeper">Sleeper</option>
          <option value="underdog">Underdog</option>
          <option value="proj2026">2026 projection</option>
          <option value="ppg2025">2025 PPG</option>
          <option value="ppg2024">2024 PPG</option>
          <option value="news">News</option>
          <option value="drafted">Drafted status</option>
        </select>
      </label>
      <button id="sortDirBtn" class="secondary sort-direction" type="button">↑ Ascending</button>
      <label class="toggle">
        <input id="compactToggle" type="checkbox">
        <span>Compact rows</span>
      </label>
      <div class="updated" id="updatedAt"></div>
    </section>

    <section id="boardView" class="table-shell">
      <table id="playerTable">
        <thead>
          <tr>
            <th class="drag-col"></th>
            <th class="sortable" data-sort="drafted" tabindex="0">Drafted <span class="sort-indicator"></span></th>
            <th class="sortable" data-sort="rank" tabindex="0">Rank <span class="sort-indicator"></span></th>
            <th class="sortable" data-sort="name" tabindex="0">Player <span class="sort-indicator"></span></th>
            <th class="sortable" data-sort="pos" tabindex="0">Pos <span class="sort-indicator"></span></th>
            <th class="sortable" data-sort="team" tabindex="0">Team <span class="sort-indicator"></span></th>
            <th class="sortable" data-sort="bye" tabindex="0">Bye <span class="sort-indicator"></span></th>
            <th class="sortable" data-sort="tier" tabindex="0">Tier <span class="sort-indicator"></span></th>
            <th class="sortable" data-sort="market" tabindex="0">Market <span class="sort-indicator"></span></th>
            <th class="sortable" data-sort="espn" tabindex="0">ESPN <span class="sort-indicator"></span></th>
            <th class="sortable" data-sort="yahoo" tabindex="0">Yahoo <span class="sort-indicator"></span></th>
            <th class="sortable" data-sort="sleeper" tabindex="0">Sleeper <span class="sort-indicator"></span></th>
            <th class="sortable" data-sort="underdog" tabindex="0">Underdog <span class="sort-indicator"></span></th>
            <th class="sortable" data-sort="proj2026" tabindex="0">2026 Proj <span class="sort-indicator"></span></th>
            <th class="sortable" data-sort="ppg2025" tabindex="0">2025 PPG <span class="sort-indicator"></span></th>
            <th class="sortable" data-sort="ppg2024" tabindex="0">2024 PPG <span class="sort-indicator"></span></th>
            <th class="sortable" data-sort="news" tabindex="0">News <span class="sort-indicator"></span></th>
          </tr>
        </thead>
        <tbody id="playerBody"></tbody>
      </table>
      <div id="emptyState" class="empty hidden">No players match these filters.</div>
    </section>

    <section id="newsView" class="news-view hidden">
      <div id="newsList"></div>
    </section>
  </main>

  <div id="drawerBackdrop" class="backdrop hidden"></div>
  <aside id="drawer" class="drawer" aria-hidden="true">
    <div class="drawer-head">
      <div>
        <div class="eyebrow" id="drawerMeta"></div>
        <h2 id="drawerName">Player</h2>
      </div>
      <button id="closeDrawer" class="icon-btn" aria-label="Close">×</button>
    </div>
    <div id="drawerContent"></div>
  </aside>

  <div id="toast" class="toast hidden"></div>

  <script src="players.js"></script>
  <script src="app.js"></script>
</body>
</html>
